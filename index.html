<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baustellen-Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.png" type="image/png">
</head>
<body>
    <div id="login-screen">
        <div class="login-container">
            <h1>🏗️ Baustellen-Manager</h1>
            <p>Willkommen zurück!</p>
            <form id="login-form">
                <input type="text" id="username" placeholder="Benutzername" required>
                <input type="password" id="password" placeholder="Passwort" required>
                <button type="submit" id="login-btn">
                    <span class="btn-text">Anmelden</span>
                    <span class="loading-spinner" style="display:none;">⏳</span>
                </button>
            </form>
            <p id="login-error" class="error-message"></p>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <header>
            <h1>🏗️ Baustellen-Manager</h1>
            <div class="header-right">
                <div class="current-date"></div>
                <button id="logout-btn">Abmelden</button>
            </div>
        </header>

        <main>
            <div class="dashboard">
                <div class="card">
                    <h2>📋 Aufgaben</h2>
                    <div class="filter-controls">
                        <div class="filter-group">
                            <label for="sort-category">Sortieren nach:</label>
                            <select id="sort-category">
                                <option value="category">Kategorie</option>
                                <option value="due-date-asc">Felligkeitsdatum (frueheste zuerst)</option>
                                <option value="due-date-desc">Felligkeitsdatum (spaeteste zuerst)</option>
                            </select>
                        </div>
                    </div>
                    <div id="tasks-list"></div>
                    <button class="add-btn" id="add-task-btn">+ Aufgabe hinzufügen</button>
                </div>

                <div class="card">
                    <h2>📅 Heute</h2>
                    <div id="today-tasks"></div>
                </div>

                <div class="card">
                    <h2>📊 Statistik</h2>
                    <div id="stats"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Aufgabe hinzufügen</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <input type="text" id="task-title" placeholder="Titel" required>
                <textarea id="task-description" placeholder="Beschreibung"></textarea>
                <select id="task-category" required>
                    <option value="">Kategorie wählen...</option>
                    <option value="Elektro">Elektro</option>
                    <option value="Sanitaer">Sanitäĺĺr</option>
                    <option value="Mauerwerk">Mauerwerk</option>
                    <option value="Innenausbau">Innenausbau</option>
                    <option value="Boden">Boden</option>
                    <option value="Fenster">Fenster</option>
                    <option value="Aussen">AuĹŸen</option>
                    <option value="Sonstiges">Sonstiges</option>
                </select>
                <input type="date" id="task-due-date" required>
                <select id="task-priority" required>
                    <option value="">Prioritäĺĺt wählen...</option>
                    <option value="Hoch">Hoch</option>
                    <option value="Mittel">Mittel</option>
                    <option value="Niedrig">Niedrig</option>
                </select>
                <select id="task-status" required>
                    <option value="Offen">Offen</option>
                    <option value="In Arbeit">In Arbeit</option>
                    <option value="Erledigt">Erledigt</option>
                </select>
                <button type="submit">Speichern</button>
            </form>
        </div>
    </div>

    <div id="subtask-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="subtask-modal-title">Unteraufgabe hinzufügen</h2>
            <form id="subtask-form">
                <input type="hidden" id="subtask-parent-id">
                <input type="hidden" id="subtask-id">
                <input type="text" id="subtask-title" placeholder="Titel" required>
                <textarea id="subtask-description" placeholder="Beschreibung"></textarea>
                <input type="date" id="subtask-due-date" required>
                <select id="subtask-status" required>
                    <option value="Offen">Offen</option>
                    <option value="In Arbeit">In Arbeit</option>
                    <option value="Erledigt">Erledigt</option>
                </select>
                <button type="submit">Speichern</button>
            </form>
        </div>
    </div>

    <div id="calendar-modal" class="modal">
        <div class="modal-content calendar-modal-content">
            <span class="close">&times;</span>
            <h2>📅 Kalender</h2>
            <div id="calendar"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

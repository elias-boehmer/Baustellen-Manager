name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Auf Pages-Deployment warten
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          URL="${E2E_BASE_URL:-https://elias-boehmer.github.io/Baustellen-Manager/}"
          echo "Warte auf $URL ..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Seite ist erreichbar (Status $STATUS)."
              exit 0
            fi
            echo "Versuch $i: Status $STATUS, warte 5s ..."
            sleep 5
          done
          echo "Seite war nach 2 Minuten nicht erreichbar (letzter Status: $STATUS)."
          exit 1

      - name: Run E2E tests
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
